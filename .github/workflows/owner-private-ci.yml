name: Owner Private CI

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: owner-private-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OWNER_GITHUB_USER_ID: "5168752"

jobs:
  authorize-owner:
    name: Authorize owner private CI
    environment: owner-private-ci
    if: >-
      vars.OWNER_PRIVATE_CI_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.id == 5168752 &&
      github.actor_id == '5168752' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and same-repository head
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"

  scaffold-contract:
    name: Scaffold Contract
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify trusted PR identity
        env:
          ACTOR_ID: ${{ github.actor_id }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail
          test "${ACTOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${PR_AUTHOR_ID}" = "${OWNER_GITHUB_USER_ID}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
      - name: Check out exact trusted PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
      - name: Enforce dormant-scaffold contract
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          unexpected="$(git ls-files | grep -Ev '^(\.gitignore|LICENSE|README\.md|\.github/)' || true)"
          if [ -n "${unexpected}" ]; then
            echo "Implementation files require substantive build/test CI:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          if git ls-files -s | awk '$1 == "120000" { found = 1 } END { exit !found }'; then
            echo "Symlinks are not permitted in the dormant scaffold" >&2
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    needs: authorize-owner
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  ci-success:
    name: CI Success
    if: always() && needs.authorize-owner.result == 'success'
    needs: [authorize-owner, scaffold-contract, dependency-review]
    runs-on: [self-hosted, Linux, X64, public-overflow]
    timeout-minutes: 5
    steps:
      - name: Verify scaffold contract
        env:
          CONTRACT_RESULT: ${{ needs.scaffold-contract.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          test "${CONTRACT_RESULT}" = "success"
          test "${DEPENDENCY_REVIEW_RESULT}" = "success"
