name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-contract:
    name: Scaffold Contract
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce dormant-scaffold contract
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          unexpected="$(git ls-files | grep -Ev '^(\.gitignore|LICENSE|README\.md|\.github/)' || true)"
          if [ -n "${unexpected}" ]; then
            echo "Implementation files require substantive build/test CI:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          if git ls-files -s | awk '$1 == "120000" { found = 1 } END { exit !found }'; then
            echo "Symlinks are not permitted in the dormant scaffold" >&2
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    if: >-
      github.event_name == 'pull_request' &&
      (vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  ci-success:
    name: CI Success
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    needs: [scaffold-contract, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Verify scaffold contract
        env:
          CONTRACT_RESULT: ${{ needs.scaffold-contract.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "${CONTRACT_RESULT}" = "success"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            test "${DEPENDENCY_REVIEW_RESULT}" = "success"
          else
            test "${DEPENDENCY_REVIEW_RESULT}" = "skipped"
          fi
